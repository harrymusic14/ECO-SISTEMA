    <!-- Fuentes alojadas localmente (public/fonts/, variables: un solo
         archivo cubre todos los pesos usados) en vez de Google Fonts. Se
         precargan aquí para que estén listas antes de que el texto necesite
         pintarse — así no hay "salto" de layout al reemplazar la fuente de
         respaldo por la real (esa era la causa del ~99% del Cumulative
         Layout Shift medido con Lighthouse), y tampoco depende de una
         conexión externa a Google en cada carga. -->
    <link rel="preload" href="/fonts/oswald-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/roboto-variable.woff2" as="font" type="font/woff2" crossorigin />
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
